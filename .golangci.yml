version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck      # 包含 gosimple 的功能
    - unused
    - revive           # 包含命名、注释等风格检查
    - gocritic         # 代码风格和性能建议
  disable:
    - wsl
    - nlreturn
    - godox
    - funlen
    - cyclop
    - gochecknoglobals
    - gochecknoinits

linters-settings:
  revive:
    rules:
      - name: exported          # 导出元素必须有注释
      - name: var-naming        # 变量命名规范
      - name: blank-imports     # 禁止无用匿名导入
      - name: context-as-argument  # context 作为第一个参数
      - name: error-return      # error 作为最后一个返回值
      - name: error-naming      # error 命名规范
      - name: exported          # 导出元素注释
      - name: package-comments  # 包注释
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
