apiVersion: v1
kind: Service
metadata:
  name: gate
  namespace: omega
spec:
  selector:
    app: gate
  ports:
    - port: 8888
      targetPort: 8888
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  namespace: omega
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gate
  template:
    metadata:
      labels:
        app: gate
    spec:
      containers:
        - name: gate
          image: omega-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
